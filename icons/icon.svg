  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="96" height="96" fill="#ff7a1f"/>
    <circle cx="45" cy="73" r="17" fill="#ffffff"/>
    <circle cx="83" cy="73" r="17" fill="#ffffff"/>
    <circle cx="50" cy="67" r="8" fill="#050f16"/>
    <circle cx="88" cy="67" r="8" fill="#050f16"/>
    <rect x="16" y="76" width="96" height="40" fill="#050f16"/>
  </g>
</svg>
